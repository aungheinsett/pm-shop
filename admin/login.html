<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - PM Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0f0f 0%, #5c1a1a 50%, #a93226 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: float 8s ease-in-out infinite;
    }
    .c1 { width: 300px; height: 300px; background: #c0392b; top: -80px; left: -80px; }
    .c2 { width: 250px; height: 250px; background: #f1948a; bottom: -50px; right: -50px; animation-delay: 2s; }
    .c3 { width: 200px; height: 200px; background: #e74c3c; top: 50%; left: 60%; animation-delay: 4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }
    .login-container {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: 90vw;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 45px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-header { text-align: center; margin-bottom: 35px; }
    .login-logo {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--gold, #c9a84c);
      margin-bottom: 10px;
    }
    .login-logo span { color: #fff; }
    .login-header h1 { color: #fff; font-size: 1.5rem; font-weight: 600; }
    .login-header p { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-top: 6px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i {
      position: absolute;
      left: 16px;
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
    }
    .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 45px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }
    .input-wrapper input::placeholder { color: rgba(255,255,255,0.4); }
    .input-wrapper input:focus {
      border-color: #c0392b;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(192,57,43,0.2);
    }
    .input-wrapper .toggle-pw {
      position: absolute;
      right: 14px;
      left: auto;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
    }
    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #c0392b, #a93226);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(192,57,43,0.4); }
    .login-btn.loading { pointer-events: none; opacity: 0.7; }
    .error-msg {
      background: rgba(220,53,69,0.15);
      border: 1px solid rgba(220,53,69,0.4);
      color: #f8d7da;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      display: none;
    }
    .error-msg.show { display: block; animation: shake 0.4s; }
    alts, keyframes { display: none; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
    }
    .login-footer a { color: #f1948a; text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">PM <span>SHOP</span></div>
      <h1>Admin Dashboard</h1>
      <p>Sign in to manage your store</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="admin@pmonline.com" required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" required>
          <i class="fas fa-eye toggle-pw" id="togglePw"></i>
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>

    <div class="login-footer">
      <p><a href="/">Back to Store</a> &nbsp;|&nbsp; Need help? <a href="mailto:support@pmonline.com">Contact us</a></p>
    </div>
  </div>

  <script>
    const togglePw = document.getElementById('togglePw');
    const password = document.getElementById('password');
    togglePw.addEventListener('click', () => {
      const type = password.type === 'password' ? 'text' : 'password';
      password.type = type;
      togglePw.classList.toggle('fa-eye-slash');
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;

      errorMsg.classList.remove('show');
      btn.classList.add('loading');
      btn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pw })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('pm_token', data.token);
          localStorage.setItem('pm_user', JSON.stringify(data.user));
          btn.innerHTML = '✓ Success!';
          btn.style.background = 'linear-gradient(135deg, #28a745, #1e7e34)';
          setTimeout(() => {
            window.location.href = '/admin';
          }, 500);
        } else {
          errorMsg.textContent = data.error || 'Login failed. Please try again.';
          errorMsg.classList.add('show');
          btn.classList.remove('loading');
          btn.innerHTML = 'Sign In';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Is the server running?';
        errorMsg.classList.add('show');
        btn.classList.remove('loading');
        btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
